<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BrainScan 11">
    
    <meta http-equiv="cache-control" content="no-cache">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="pragma" content="no-cache">

    <title>BrainScan 11</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="win-app">
        <header class="win-header">
            <div class="title-bar"><h1>BrainScan 11</h1></div>
        </header>
        <main class="win-content">
            <div class="win-card">
                <canvas id="mainCanvas" style="width:100%; border-radius:8px; background:#eee;"></canvas>
                <div id="ocrStatus">Esperando...</div>
            </div>
            <div id="resultCard" class="win-card" style="display:none;">
                <div id="smartSummary" contenteditable="true"></div>
            </div>
        </main>
        <footer class="win-taskbar">
            <button onclick="document.getElementById('fileInp').click()">📷 Foto</button>
            <input type="file" id="fileInp" accept="image/*" capture="environment" style="display:none" onchange="handleCapture(event)">
            <button onclick="runSmartOCR()">🔍 Analizar</button>
            <button onclick="saveAndSend()">📧 Enviar</button>
        </footer>
    </div>

    <script src="app.js"></script>
    <script>
        // REGISTRO ROBUSTO: Detecta la ruta automáticamente
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swPath = window.location.pathname.endsWith('/') 
                               ? 'sw.js' 
                               : window.location.pathname.split('/').pop() === 'index.html' 
                                 ? 'sw.js' 
                                 : './
